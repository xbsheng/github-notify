name: GitHub 通知

on:
  # 注意：不能用 star 事件！GitHub 解析器 bug：star + workflow_dispatch 同时存在时
  # 报 “Unexpected value 'star'”。有人 star 时会触发 watch 事件 (action=started)，语义等价。
  watch:
    types: [started]
  fork:
  issues:
    types: [opened, closed, reopened]
  pull_request:
    types: [opened, closed, reopened]
  schedule:
    - cron: '*/10 * * * *' # 轮询新粉丝
  workflow_dispatch: # 手动触发，发一条测试消息

permissions:
  contents: write

concurrency:
  group: notify

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 推送通知
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          FOLLOW_OWNER: ${{ vars.FOLLOW_OWNER }}
          REPO_OWNER: ${{ github.repository_owner }}
          EVENT_NAME: ${{ github.event_name }}
        run: python .github/scripts/notify.py
      - name: 提交 followers 状态
        if: github.event_name == 'schedule'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add followers.json
          git diff --cached --quiet || git commit -m "chore: update followers.json"
          git push
